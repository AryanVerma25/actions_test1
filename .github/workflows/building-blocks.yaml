name: Building Blocks

on:
  push:
    branches:
        - main

jobs:
  echo-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "Hello, world!"

  echo-goodbye:
    runs-on: ubuntu-latest

    steps:
      - name: Failed step
        run: echo "This step will fail"


      - name: Say goodbye
        run: echo "Goodbye, world!"